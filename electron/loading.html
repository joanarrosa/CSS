<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>CSS Audit</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f6f8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1a1d23;
  }
  .box {
    text-align: center;
    max-width: 440px;
    padding: 0 24px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 12px;
  }
  #status {
    color: #6b7280;
    font-size: 14px;
    line-height: 1.5;
  }
  .spinner {
    width: 28px;
    height: 28px;
    margin: 0 auto 18px;
    border: 3px solid #e0e2e7;
    border-top-color: #3457d5;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>Starting CSS Audit…</h1>
    <p id="status">Preparing…</p>
  </div>
</body>
</html>

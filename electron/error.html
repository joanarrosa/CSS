<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>CSS Audit</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f6f8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1a1d23;
  }
  .box {
    text-align: center;
    max-width: 480px;
    padding: 0 24px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 12px;
    color: #b3261e;
  }
  #message {
    color: #6b7280;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    text-align: left;
    background: #fbeae9;
    border-radius: 8px;
    padding: 12px 16px;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>Couldn't start CSS Audit</h1>
    <div id="message">Something went wrong.</div>
  </div>
</body>
</html>

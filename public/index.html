<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CSS Audit</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="page">
  <header class="page-header">
    <h1>CSS Audit</h1>
    <p>Paste a URL, then analyze its CSS or run a full accessibility audit.</p>
  </header>

  <div class="url-row">
    <input id="url-input" type="url" placeholder="https://example.com" autocomplete="off" required />
  </div>

  <div class="tabs" role="tablist">
    <button type="button" class="tab-btn tab-btn--active" data-tab="css" role="tab" aria-selected="true">CSS Audit</button>
    <button type="button" class="tab-btn" data-tab="a11y" role="tab" aria-selected="false">Accessibility</button>
  </div>

  <section id="tab-css" class="tab-panel tab-panel--active" data-tab-panel="css">
    <button id="analyze-btn" type="button" class="primary-btn">Analyze CSS</button>
    <div id="status" class="status" role="status"></div>
    <div id="summary"></div>
    <div id="filter-bar" class="filter-bar"></div>
    <div id="results"></div>
  </section>

  <section id="tab-a11y" class="tab-panel" data-tab-panel="a11y" hidden>
    <button id="a11y-report-btn" type="button" class="primary-btn">Analyze Accessibility</button>
    <div id="a11y-report-status" class="status" role="status"></div>
    <div id="a11y-report"></div>
  </section>
</div>
<script src="/app.js"></script>
</body>
</html>
